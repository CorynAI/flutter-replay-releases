name: coryn_replay
description: Coryn Session Replay SDK for Flutter. Records UI captures with leak-proof masking, states, events, screens and API requests through the Coryn Android SDK.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.0

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ai.coryn.replay.flutter
        pluginClass: CorynReplayPlugin
