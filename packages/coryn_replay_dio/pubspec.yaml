name: coryn_replay_dio
description: Records Dio requests as Coryn API request events, with the same redaction rules as the Coryn Android OkHttp interceptor.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  coryn_replay:
    git:
      url: https://github.com/CorynAI/flutter-replay-releases.git
      path: packages/coryn_replay
      ref: v0.1.0
  dio: ^5.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
